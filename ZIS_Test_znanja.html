<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#18212d; --muted:#5d6978; --line:#dfe4ea;
    --accent:#1f5eff; --accent-ink:#fff; --accent-soft:#e8eeff;
    --ok:#12805c; --ok-bg:#e4f6ee; --bad:#c0392b; --bad-bg:#fdeceb; --mid:#b9770e; --mid-bg:#fff3dc;
    --code:#eef1f5;
  }
  @media all{
    :root[data-theme="dark"]{
      color-scheme:dark;
      --bg:#0e131a; --card:#171e28; --ink:#e7ecf3; --muted:#9aa6b6; --line:#28323f;
      --accent:#7aa2ff; --accent-ink:#0b1220; --accent-soft:#1b2947;
      --ok:#48d19b; --ok-bg:#12302a; --bad:#ff8a7d; --bad-bg:#3a1b19; --mid:#f2b24c; --mid-bg:#3a2d10;
      --code:#202a37;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
  .bar{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700;margin-right:auto}
  .tab,.lnk{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  main{max-width:880px;margin:0 auto;padding:20px 16px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  h1{font-size:26px;margin:0 0 8px}
  h2{font-size:20px;margin:0 0 10px}
  h3{font-size:16px;margin:16px 0 6px}
  .muted{color:var(--muted)}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:6px 12px;font-size:14px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
  .prog>i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .chip{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.mid{background:var(--mid-bg);color:var(--mid)} .chip.none{background:var(--code);color:var(--muted)}
  .q{font-size:18px;margin:12px 0 14px}
  .q b,.q .mono,.mono{font-family:Consolas,"Cascadia Mono",monospace}
  .q b.mono{font-weight:700}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .opt .k{flex:none;min-width:24px;height:24px;border-radius:6px;background:var(--code);display:grid;place-items:center;font-size:13px;font-weight:700}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.right{border-color:var(--ok);background:var(--ok-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt:disabled{cursor:default}
  input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
  input[type=text]{font-family:Consolas,"Cascadia Mono",monospace;font-size:17px;letter-spacing:.04em}
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus,.opt:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--accent-soft);border-color:var(--accent)}
  .hint{font-size:13.5px;color:var(--muted);margin:6px 0 10px}
  .fb{margin-top:16px;border-radius:12px;padding:12px 16px;border:1.5px solid}
  .fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)} .fb.mid{background:var(--mid-bg);border-color:var(--mid)}
  .fb .t{font-weight:700;margin-bottom:4px}
  .fb p{margin:6px 0}
  .pts label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
  .pts input{margin-top:5px;width:18px;height:18px;flex:none}
  table.t{border-collapse:collapse;width:100%;font-size:14.5px}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
  table.t th{color:var(--muted);font-weight:600;font-size:13px}
  table.g{border-collapse:collapse;margin:8px 0;font-family:Consolas,monospace;font-size:14px}
  table.g td,table.g th{border:1px solid var(--line);padding:3px 8px;text-align:center}
  table.g th{background:var(--accent-soft)}
  .meter{width:100%;height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}
  .meter>i{display:block;height:100%}
  .big{font-size:44px;font-weight:800;line-height:1}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat{background:var(--code);border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:13px;color:var(--muted)}
  .mx{display:inline-grid;grid-template-columns:repeat(2,auto);gap:2px 14px;padding:0 8px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:4px;vertical-align:middle;margin:0 4px;font-family:Consolas,monospace}
  .mx.v{grid-template-columns:auto}
  .mx i{font-style:normal;text-align:center}
  a{color:var(--accent)}
  dialog{border:0;border-radius:16px;padding:0;max-width:680px;width:calc(100% - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(5,10,20,.6)}
  .dlg{padding:22px 24px;max-height:86vh;overflow:auto}
  .dlg .foot{position:sticky;bottom:-22px;background:var(--card);padding:14px 0 4px;margin-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .wr{border-left:4px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14.5px}
  .rec{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:8px 0}
  .small{font-size:13.5px}
  kbd{background:var(--code);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12.5px}
</style>

<script>
'use strict';
/* =====================================================================
   OSNOVE
   ===================================================================== */
const LS_KEY='zis-test-znanja-v1';
const SCRIPT='ZIS_Skripta_za_ucenje.html';
const ROUND_SIZE=10;
const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const $=(s,r=document)=>r.querySelector(s);
const mod=(a,n)=>((a%n)+n)%n;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stripTags=s=>String(s).replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<sub>(.*?)<\/sub>/g,'_$1').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const strip=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d');
const normText=s=>strip(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const parseNum=(raw,int)=>{let s=String(raw).trim().replace(/\s+/g,'');if(int)s=s.replace(/[.,]/g,'');else s=s.replace(',','.');if(s==='')return NaN;return Number(s);};
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const dec=x=>String(Math.round(x*10)/10).replace('.',',');
const sup=(b,e)=>`${b}<sup>${e}</sup>`;
const anchor=id=>`${SCRIPT}#t${id.replace('.','-')}`;

/* =====================================================================
   TEME (iste oznake odeljaka kao u skripti)
   ===================================================================== */
const LESSONS={1:'Lekcija 1 · Uvod',2:'Lekcija 2 · Sigurnost kriptosistema',3:'Lekcija 3 · Klasične šifre'};
const TOPICS=[
 ['1.1','Pojmovi kriptologije'],['1.2','Istorijat kriptologije'],['1.3','Značaj kriptologije'],['1.4','Osnovna terminologija'],['1.5','Komunikacioni kanal'],
 ['2.1','Algoritam i ključevi (simetrični / asimetrični)'],['2.2','Kerkhofov princip'],['2.3','Potpuna pretraga i prostor ključeva'],['2.4','Sigurnost kriptosistema i skraćeni napad'],
 ['2.5','Podela klasičnih šifara'],['2.6','Šifre transpozicije'],['2.7','Kriptoanaliza transpozicije'],['2.8','Šifre supstitucije i Cezarova šifra'],['2.9','Kriptoanaliza Cezara i statistika jezika'],
 ['3.1','Modularna aritmetika'],['3.2','Homofona šifra'],['3.3','Hilova šifra'],['3.4','Vižnerova šifra'],['3.5','Kriptoanaliza Vižnera i indeks koincidencije'],['3.6','One-time pad'],['3.7','Kodne knjige'],['3.8','Blokovske i protočne šifre']
].map(([id,name])=>({id,name,lesson:+id[0]}));
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const tname=id=>`${id} ${TOPIC[id].name}`;

/* =====================================================================
   KRIPTO POMOĆNE FUNKCIJE (koriste ih generatori i samoprovera)
   ===================================================================== */
const caesar=(s,k)=>[...s].map(c=>A[mod(A.indexOf(c)+k,26)]).join('');
const vig=(s,key,dir=1)=>[...s].map((c,i)=>A[mod(A.indexOf(c)+dir*A.indexOf(key[i%key.length]),26)]).join('');
const atbash=s=>[...s].map(c=>A[25-A.indexOf(c)]).join('');
function colTransp(text,cols,order){ // upis po redovima, čitanje kolona po zadatom redosledu (indeksi kolona)
  const rows=Math.ceil(text.length/cols);let out='';
  const ord=order||[...Array(cols).keys()];
  for(const c of ord)for(let r=0;r<rows;r++){const i=r*cols+c;if(i<text.length)out+=text[i];}
  return out;
}
function keyOrder(key){ // redosled čitanja kolona prema alfabetskom rangu slova ključa
  return [...key].map((ch,i)=>({ch,i})).sort((a,b)=>a.ch<b.ch?-1:a.ch>b.ch?1:a.i-b.i).map(o=>o.i);
}
function doubleTransp(text,rows,cols,rowPerm,colPerm){
  const m=[];for(let r=0;r<rows;r++)m.push([...text.slice(r*cols,r*cols+cols)]);
  let out='';for(const r of rowPerm)for(const c of colPerm)out+=m[r][c];return out;
}
const inv26=a=>{for(let x=1;x<26;x++)if(mod(a*x,26)===1)return x;return null;};
const det2=M=>mod(M[0][0]*M[1][1]-M[0][1]*M[1][0],26);
const hillInv=M=>{const di=inv26(det2(M));return [[mod(di*M[1][1],26),mod(-di*M[0][1],26)],[mod(-di*M[1][0],26),mod(di*M[0][0],26)]];};
const mulMV=(M,v)=>[mod(M[0][0]*v[0]+M[0][1]*v[1],26),mod(M[1][0]*v[0]+M[1][1]*v[1],26)];
const hillText=(s,M)=>{let o='';for(let i=0;i<s.length;i+=2){const c=mulMV(M,[A.indexOf(s[i]),A.indexOf(s[i+1])]);o+=A[c[0]]+A[c[1]];}return o;};
const mx=M=>`<span class="mx">${M.flat().map(v=>`<i>${v}</i>`).join('')}</span>`;
const vx=v=>`<span class="mx v">${v.map(x=>`<i>${x}</i>`).join('')}</span>`;
const HOMO={A:['01','07'],B:['14'],C:['21'],D:['04'],E:['13','17'],F:['20'],G:['29'],H:['31'],I:['06'],J:['28'],K:['12'],L:['30'],M:['27'],N:['00','18'],O:['26','19'],P:['09'],Q:['10'],R:['25','23'],S:['02'],T:['08','24'],U:['22'],V:['05'],W:['16'],X:['15'],Y:['11'],Z:['03']};
const HOMO_REV={};for(const [l,cs] of Object.entries(HOMO))for(const c of cs)HOMO_REV[c]=l;
const homoTable=()=>{const row=(a,b)=>`<tr>${[...A.slice(a,b)].map(l=>`<th>${l}</th>`).join('')}</tr><tr>${[...A.slice(a,b)].map(l=>`<td>${HOMO[l].join('/')}</td>`).join('')}</tr>`;return `<table class="g">${row(0,13)}${row(13,26)}</table>`;};
const OTPA=['E','H','I','K','L','R','S','T'];
const bin3=l=>OTPA.indexOf(l).toString(2).padStart(3,'0');
const otpTable=()=>`<table class="g"><tr>${OTPA.map(l=>`<th>${l}</th>`).join('')}</tr><tr>${OTPA.map(l=>`<td>${bin3(l)}</td>`).join('')}</tr></table>`;
const xorStr=(a,b)=>[...a].map((x,i)=>x===b[i]?'0':'1').join('');
const WORDS=['ATTACK','DEFEND','SECRET','CIPHER','MESSAGE','NETWORK','SYSTEM','PRIVATE','PUBLIC','SECURITY','ENCRYPT','MODULAR','HISTORY','TRANSFER','PROTECT','DOCUMENT','PASSWORD','ANALYSIS','KEYSPACE','PLAINTEXT'];
const PHRASES=['OCEKUJEMMIHOLJSKOLETO','ATTACKATDAWNTOMORROW','ZASTITAINFORMACIONIHSISTEMA','KRIPTOGRAFIJAJENAUKA','KLJUCJETAJNIPODATAK','SIFRATJENECITLJIVTEKST'];
function steps(word,k,dir){ // prikaz prvih nekoliko slova Cezar računa
  const out=[...word].slice(0,5).map(c=>{const n=A.indexOf(c);const v=dir>0?mod(n+k,26):mod(n+26-k,26);
    return dir>0?`${c}=${n} → (${n} + ${k}) mod 26 = ${v} → <b>${A[v]}</b>`:`${c}=${n} → (${n} + 26 − ${k}) mod 26 = ${v} → <b>${A[v]}</b>`;});
  return out.join('<br>')+(word.length>5?'<br>…':'');
}

/* =====================================================================
   BANKA STATIČKIH PITANJA
   mc(...)    : tačan odgovor je uvek prvi navedeni; opcije se mešaju pri prikazu
   ===================================================================== */
const BANK=[];const _cnt={};
function reg(q){_cnt[q.topic]=(_cnt[q.topic]||0)+1;q.id=q.topic+'#'+_cnt[q.topic];BANK.push(q);return q;}
const mc=(topic,q,right,wrongs,expl)=>reg({type:'mc',topic,q,o:[right,...wrongs],expl});
const tf=(topic,q,truth,expl)=>reg({type:'tf',topic,q,truth,expl});
const multi=(topic,q,rights,wrongs,expl)=>reg({type:'multi',topic,q,rights,wrongs,expl});
const inp=(topic,q,answers,expl,hint)=>reg({type:'in',topic,q,answers,expl,hint});
const open=(topic,q,points,expl)=>reg({type:'open',topic,q,points,expl});

/* ---------- 1.1 Pojmovi kriptologije ---------- */
mc('1.1','Nauka koja proučava metode zaštite – skrivanja informacija, podataka i poruka – naziva se:','kriptologija',['kriptografija','kriptoanaliza','steganografija'],'Kriptologija je krovna nauka; obuhvata kriptografiju (pravljenje zaštite) i kriptoanalizu (razbijanje zaštite).');
mc('1.1','Postupci kojima se informacija sakriva tako da bude čitljiva samo onima kojima je namenjena su:','kriptografija',['kriptoanaliza','heš funkcija','autentifikacija'],'Kriptografija = postupci sakrivanja poruke (enkripcija, kriptovanje).');
mc('1.1','Tehnike „probijanja" zaštite i otkrivanja zaštićenih sadržaja od strane napadača čine:','kriptoanalizu',['kriptografiju','kriptologiju','steganografiju'],'Kriptoanaliza je strana napada: razbijanje zaštite i otkrivanje sadržaja onima kojima nije namenjen.');
mc('1.1','Grčka reč ΚΡΥΠΤΟΣ (κρυπτός) znači:','sakriven',['pisanje','nauka','ključ'],'kripto = sakriven. Dalje: logija (nauka), grafija (pisanje), analiza.');
mc('1.1','Reč kriptografija nastala je od:','kripto + grafija',['kripto + logija','kripto + analiza','kripto + algoritam'],'kripto + grafija; logija daje kriptologiju, analiza kriptoanalizu.');
tf('1.1','Kriptoanaliza je deo odbrane i služi da se podaci zaštite od napadača.',false,'Kriptoanaliza je razbijanje zaštite (strana napadača). Zaštitom se bavi kriptografija.');
tf('1.1','Kriptologija obuhvata i kriptografiju i kriptoanalizu.',true,'Kriptologija je nauka o zaštiti informacija u celini – i pravljenje i razbijanje zaštite.');
mc('1.1','Napadač pokušava da bez ključa pročita šifrovanu poruku. Čime se bavi?','kriptoanalizom',['kriptografijom','enkripcijom','steganografijom'],'Razbijanje zaštite = kriptoanaliza.');
open('1.1','Šta je kriptologija?',['nauka koja proučava metode zaštite / skrivanja informacija, podataka, poruka','obuhvata kriptografiju i kriptoanalizu','kripto (sakriven) + logija']);
open('1.1','Šta je kriptografija?',['postupci za sakrivanje informacija (poruka)','poruka je čitljiva samo onima kojima je namenjena','enkripcija / kriptovanje (kripto + grafija)']);
open('1.1','Šta je kriptoanaliza?',['tehnike „probijanja" (razbijanja) zaštite','otkrivanje zaštićenih sadržaja','od strane napadača, tj. onih kojima poruka nije namenjena']);

/* ---------- 1.2 Istorijat ---------- */
mc('1.2','Potreba za zaštitom podataka pojavila se:','kada se pojavila pisana reč (pismo)',['pojavom računara','pojavom interneta','u 20. veku, u ratovima']);
mc('1.2','Prelomna tačka između manuelnog i automatskog šifrovanja je:','pojava računara',['pojava pisma','Cezarova šifra','pojava interneta'],'Pre računara – manuelno (ručno), posle – automatsko.');
mc('1.2','Skitali (σκυτάλη) je:','traka omotana oko štapa',['obrnuti alfabet','pismo sa čvorovima','rečnik reči i kodova'],'Skitali je šifra transpozicije – poruka se piše po traci namotanoj na štap.');
mc('1.2','Atbaš je:','biblijska šifra obrnutog alfabeta (A↔Z, B↔Y …)',['traka oko štapa','pomeraj za 3 mesta','pismo sa čvorovima']);
mc('1.2','Quipu je:','pismo sa čvorovima',['traka oko štapa','obrnuti alfabet','tabela sa 26 alfabeta']);
mc('1.2','Koji sistem NIJE među najstarijim opisanim sistemima sa slajda?','Vižnerova šifra',['skitali','Atbaš','Cezarova šifra'],'Vižnerova šifra je kasnije (polialfabetska) i obrađuje se u lekciji 3.');
tf('1.2','Skitali je primer šifre supstitucije.',false,'Skitali premešta slova – to je transpozicija.');

const GENS=[];
const gen=(id,topic,label,make)=>GENS.push({id,topic,label,make});
const numCheck=(ans,int)=>r=>{const v=parseNum(r,int);return !isNaN(v)&&Math.abs(v-ans)<1e-9;};
const inputQ=(q,hint,answerText,check,expl)=>({type:'in',q,hint,answerText,check,expl});

  return inputQ(`Šifruj <b>Atbaš</b> šifrom (A↔Z, B↔Y, C↔X, …) otvoreni tekst <b class="mono">${w}</b>.`,'Velikim slovima, bez razmaka.',c,r=>normText(r)===c,
  `Svako slovo se menja „simetričnim" slovom sa kraja alfabeta (slovo sa rednim brojem n → 25 − n).<br>${[...w].slice(0,5).map(ch=>`${ch}→<b>${A[25-A.indexOf(ch)]}</b>`).join(', ')}${w.length>5?' …':''}<br>Šifrat: <b class="mono">${c}</b>`);});

gen('caesar-enc','2.8','Cezar – šifrovanje reči',()=>{const w=pick(WORDS),k=Math.random()<.3?3:rnd(1,25),c=caesar(w,k);
  return inputQ(`Šifruj Cezarovom šifrom (ključ = <b>${k}</b>) otvoreni tekst <b class="mono">${w}</b>.`,'Velikim slovima, bez razmaka. (A=0, B=1, … Z=25)',c,r=>normText(r)===c,
  `C<sub>i</sub> = (P<sub>i</sub> + ${k}) mod 26<br>${steps(w,k,1)}<br>Šifrat: <b class="mono">${c}</b>`);});

gen('caesar-dec','2.8','Cezar – dešifrovanje reči',()=>{const w=pick(WORDS),k=rnd(1,25),c=caesar(w,k);
  return inputQ(`Dešifruj Cezarov šifrat <b class="mono">${c}</b> ako je ključ = <b>${k}</b>.`,'Velikim slovima, bez razmaka.',w,r=>normText(r)===w,
  `P<sub>i</sub> = (C<sub>i</sub> + 26 − ${k}) mod 26<br>${steps(c,k,-1)}<br>Otvoreni tekst: <b class="mono">${w}</b>`);});

gen('caesar-num','2.8','Cezar – formula na jednom slovu',()=>{const k=rnd(2,25);let p=rnd(0,25);if(Math.random()<.7)p=rnd(Math.max(0,26-k),25);const v=mod(p+k,26);
  return inputQ(`Slovo <b>${A[p]}</b> ima redni broj ${p}. Koliko je C<sub>i</sub> = (P<sub>i</sub> + K<sub>E</sub>) mod 26 za ključ K<sub>E</sub> = ${k}?`,'Upiši broj (0–25).',String(v),numCheck(v,true),
  `(${p} + ${k}) mod 26 = ${p+k} mod 26 = <b>${v}</b> → slovo <b>${A[v]}</b>.`);});

gen('caesar-dec-num','2.8','Cezar – formula dešifrovanja',()=>{const k=rnd(2,25);const c=rnd(0,k-1);const v=mod(c+26-k,26);
  return inputQ(`Slovo šifrata ima redni broj C<sub>i</sub> = ${c}, ključ K<sub>E</sub> = ${k}. Koliko je P<sub>i</sub> = (C<sub>i</sub> + 26 − K<sub>E</sub>) mod 26?`,'Upiši broj (0–25).',String(v),numCheck(v,true),
  `(${c} + 26 − ${k}) mod 26 = ${c+26-k} mod 26 = <b>${v}</b> → slovo <b>${A[v]}</b>.`);});

gen('caesar-key','2.9','Cezar – pogađanje ključa',()=>{const w=pick(WORDS),k=rnd(1,25),c=caesar(w,k);
  return inputQ(`Cezarov šifrat počinje slovom <b>${c[0]}</b>, a poznato je da otvoreni tekst počinje slovom <b>${w[0]}</b>. Koliki je ključ (pomeraj)?`,'Upiši broj 1–25.',String(k),numCheck(k,true),
  `K = (C − P) mod 26 = (${A.indexOf(c[0])} − ${A.indexOf(w[0])}) mod 26 = <b>${k}</b>. (Šifrat: ${c}, otvoreni tekst: ${w}.)`);});

gen('mod-op','3.1','Modularna aritmetika',()=>{const t=rnd(0,2);
  if(t===0){const n=pick([26,12,7,10]),a=rnd(10,99),b=rnd(10,99),v=(a+b)%n;return inputQ(`Izračunaj (${a} + ${b}) mod ${n}.`,'Upiši broj.',String(v),numCheck(v,true),`${a} + ${b} = ${a+b}; ${a+b} mod ${n} = <b>${v}</b> (ostatak pri deljenju sa ${n}).`);}
  if(t===1){const a=rnd(27,300),v=a%26;return inputQ(`Izračunaj ${a} mod 26.`,'Upiši broj.',String(v),numCheck(v,true),`${a} = ${Math.floor(a/26)}·26 + ${v} → <b>${v}</b>.`);}
  const c=rnd(0,10),k=rnd(11,25),v=mod(c+26-k,26);return inputQ(`Izračunaj (${c} + 26 − ${k}) mod 26.`,'Upiši broj.',String(v),numCheck(v,true),`${c} + 26 − ${k} = ${c+26-k}; mod 26 = <b>${v}</b>.`);});

  return inputQ(`Ključ ima <b>${b}</b> bita. Koliko ključeva se u proseku mora testirati pri potpunoj pretrazi?`,'Upiši broj.',String(v/2),numCheck(v/2,true),`Prostor je 2<sup>${b}</sup> = ${fmt(v)}, u proseku polovina: 2<sup>${b-1}</sup> = <b>${fmt(v/2)}</b>.`);});

gen('brute-time','2.4','Vreme potpune pretrage (stepeni dvojke)',()=>{
  if(Math.random()<.65){const n=rnd(56,128),s=pick([20,30,40]);const x=n-1-s;
    return inputQ(`Ključ ima <b>${n}</b> bita. Napadač testira 2<sup>${s}</sup> ključeva u sekundi. Potpuna pretraga u proseku traje 2<sup>x</sup> sekundi. Koliko je x?`,'Upiši ceo broj. (U proseku se testira polovina prostora.)',String(x),numCheck(x,true),`Prostor: 2<sup>${n}</sup>; u proseku polovina: 2<sup>${n-1}</sup>. Vreme = 2<sup>${n-1}</sup> / 2<sup>${s}</sup> = 2<sup>${n-1}-${s}</sup> = 2<sup><b>${x}</b></sup> s.`);}
  const m=rnd(40,70),s=pick([20,30]);const x=m-s;
  return inputQ(`Za neki sistem postoji skraćeni napad koji zahteva proveru samo 2<sup>${m}</sup> ključeva. Testira se 2<sup>${s}</sup> ključeva u sekundi. Napad traje 2<sup>x</sup> sekundi. Koliko je x?`,'Upiši ceo broj.',String(x),numCheck(x,true),`2<sup>${m}</sup> / 2<sup>${s}</sup> = 2<sup><b>${x}</b></sup> sekundi.`);});

gen('double-count','2.6','Broj šifrata dvostruke transpozicije',()=>{const r=rnd(3,8),c=rnd(2,6);let f=1;const fa=n=>{let x=1;for(let i=2;i<=n;i++)x*=i;return x;};const v=fa(r)*fa(c);
  return inputQ(`Dvostruka transpozicija koristi matricu <b>[${r} × ${c}]</b> (${r} redova, ${c} kolona). Koliko je mogućih šifrata (m! × n!)?`,'Upiši broj.',String(v),numCheck(v,true),`${r}! × ${c}! = ${fa(r)} × ${fa(c)} = <b>${fmt(v)}</b>.`);});

gen('col-transp','2.6','Transpozicija kolona (šifrovanje)',()=>{const c=rnd(3,5),r=rnd(3,4),t=pick(PHRASES).slice(0,r*c),ct=colTransp(t,c);
  const rows=[];for(let i=0;i<r;i++)rows.push([...t.slice(i*c,i*c+c)]);
  return inputQ(`Transpozicija kolona, matrica sa <b>${c}</b> kolona i ${r} reda. Otvoreni tekst <b class="mono">${t}</b> upisuje se po redovima. Koji je šifrat (čitanje kolona sleva udesno)?`,'Velikim slovima, bez razmaka.',ct,x=>normText(x)===ct,
  `Matrica ${r}×${c}:<table class="g">${rows.map(rw=>`<tr>${rw.map(ch=>`<td>${ch}</td>`).join('')}</tr>`).join('')}</table>Čitamo kolonu po kolonu: <b class="mono">${ct}</b>.`);});

gen('col-transp-key','2.6','Transpozicija kolona sa ključnom rečju',()=>{const key=pick(['KOSA','SUNCE','LIMUN','MOST','VODA','ZIMA','PERA','KLJUC']),c=key.length,r=rnd(3,4),t=pick(PHRASES).slice(0,r*c);
  const ord=keyOrder(key),ct=colTransp(t,c,ord);const rank=[];ord.forEach((ci,p)=>rank[ci]=p+1);
  const rows=[];for(let i=0;i<r;i++)rows.push([...t.slice(i*c,i*c+c)]);
  return inputQ(`Transpozicija kolona sa ključem <b class="mono">${key}</b> (matrica ${r}×${c}). Otvoreni tekst <b class="mono">${t}</b> upisuje se po redovima, a kolone se čitaju redom prema alfabetskom redosledu slova ključa. Koji je šifrat?`,'Velikim slovima, bez razmaka.',ct,x=>normText(x)===ct,
  `Brojevi kolona (po alfabetu slova ključa): ${[...key].map((ch,i)=>`${ch}=${rank[i]}`).join(', ')}.<br><table class="g"><tr>${[...key].map(ch=>`<th>${ch}</th>`).join('')}</tr><tr>${rank.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(rw=>`<tr>${rw.map(ch=>`<td>${ch}</td>`).join('')}</tr>`).join('')}</table>Čitamo kolone 1, 2, 3…: <b class="mono">${ct}</b>.`);});

gen('hill-enc','3.3','Hilova šifra – šifrovanje bloka',()=>{
  let M;if(Math.random()<.25)M=[[22,13],[11,5]];else do{M=[[rnd(1,15),rnd(0,15)],[rnd(0,15),rnd(1,15)]];}while(gcd(det2(M),26)!==1);
  const p=[rnd(0,25),rnd(0,25)],c=mulMV(M,p),pt=A[p[0]]+A[p[1]],ct=A[c[0]]+A[c[1]];
  return inputQ(`Hilova šifra, n = 2, ključ A = ${mx(M)}. Šifruj blok <b class="mono">${pt}</b>, tj. P = ${vx(p)} (A=0 … Z=25). Upiši šifrat (dva slova).`,'Dva velika slova.',ct,x=>normText(x)===ct,
  `C = A × P mod 26<br>C<sub>0</sub> = (${M[0][0]}·${p[0]} + ${M[0][1]}·${p[1]}) mod 26 = ${M[0][0]*p[0]+M[0][1]*p[1]} mod 26 = <b>${c[0]}</b> → ${A[c[0]]}<br>C<sub>1</sub> = (${M[1][0]}·${p[0]} + ${M[1][1]}·${p[1]}) mod 26 = ${M[1][0]*p[0]+M[1][1]*p[1]} mod 26 = <b>${c[1]}</b> → ${A[c[1]]}<br>Šifrat: <b class="mono">${ct}</b>`);});

gen('hill-dec','3.3','Hilova šifra – dešifrovanje bloka',()=>{
  let M;do{M=[[rnd(1,15),rnd(0,15)],[rnd(0,15),rnd(1,15)]];}while(gcd(det2(M),26)!==1);
  const Mi=hillInv(M),p=[rnd(0,25),rnd(0,25)],c=mulMV(M,p),pt=A[p[0]]+A[p[1]],ct=A[c[0]]+A[c[1]];
  return inputQ(`Hilova šifra, n = 2. Poznata je inverzna matrica ključa A<sup>−1</sup> = ${mx(Mi)}. Dešifruj šifrat blok <b class="mono">${ct}</b>, tj. C = ${vx(c)} (P = A<sup>−1</sup> × C mod 26). Upiši dva slova.`,'Dva velika slova.',pt,x=>normText(x)===pt,
  `P<sub>0</sub> = (${Mi[0][0]}·${c[0]} + ${Mi[0][1]}·${c[1]}) mod 26 = ${Mi[0][0]*c[0]+Mi[0][1]*c[1]} mod 26 = <b>${p[0]}</b> → ${A[p[0]]}<br>P<sub>1</sub> = (${Mi[1][0]}·${c[0]} + ${Mi[1][1]}·${c[1]}) mod 26 = ${Mi[1][0]*c[0]+Mi[1][1]*c[1]} mod 26 = <b>${p[1]}</b> → ${A[p[1]]}<br>Otvoreni tekst: <b class="mono">${pt}</b>`);});

gen('homo-dec','3.2','Homofona šifra – dešifrovanje',()=>{const w=pick(['CIPHER','SECRET','ATTACK','SYSTEM','PUBLIC','NETWORK','TEETH','ROTOR']),codes=[...w].map(l=>pick(HOMO[l]));
  return inputQ(`Homofona šifra iz primera sa slajda (dvocifreni brojevi 00–31):${homoTable()}Dešifruj: <b class="mono">${codes.join(' ')}</b>`,'Velikim slovima, bez razmaka.',w,x=>normText(x)===w,
  `Svaki par cifara odgovara jednom slovu: ${codes.map(c=>`${c}→<b>${HOMO_REV[c]}</b>`).join(', ')}.<br>Otvoreni tekst: <b class="mono">${w}</b>`);});

gen('homo-enc','3.2','Homofona šifra – šifrovanje',()=>{const w=pick(['TEETH','ROTOR','ATTACK','NOTE','ARENA','TREAT']);
  const ans=[...w].map(l=>HOMO[l][0]).join(' ');
  return inputQ(`Homofona šifra iz primera sa slajda:${homoTable()}Šifruj reč <b class="mono">${w}</b>. (Slova koja imaju dve šifre možeš da šifruješ bilo kojom; upiši dvocifrene brojeve.)`,'Npr. 08 13 17 24 31 – dvocifreni brojevi, odvojeni razmakom.',ans,x=>{const d=String(x).replace(/\D/g,'');if(d.length!==w.length*2)return false;for(let i=0;i<w.length;i++)if(!HOMO[w[i]].includes(d.substr(i*2,2)))return false;return true;},

gen('vig-enc','3.4','Vižner – šifrovanje',()=>{const key=pick(['LIMUN','SUNCE','KOSA','MOST','LEMON','KEY','ZIMA']),w=pick(WORDS).slice(0,rnd(6,8)),c=vig(w,key,1);
  const rows=[...w].map((ch,i)=>{const k=key[i%key.length],pn=A.indexOf(ch),kn=A.indexOf(k);return `<tr><td>${ch}</td><td>${k}</td><td>${pn}+${kn}</td><td>${mod(pn+kn,26)}</td><td><b>${A[mod(pn+kn,26)]}</b></td></tr>`;}).join('');
  return inputQ(`Šifruj Vižnerovom šifrom otvoreni tekst <b class="mono">${w}</b> ključem <b class="mono">${key}</b> (A=0 … Z=25, ključ se ponavlja).`,'Velikim slovima, bez razmaka.',c,x=>normText(x)===c,
  `C<sub>i</sub> = (P<sub>i</sub> + K<sub>i mod m</sub>) mod 26, m = ${key.length}<table class="g"><tr><th>P</th><th>K</th><th>P+K</th><th>mod 26</th><th>C</th></tr>${rows}</table>Šifrat: <b class="mono">${c}</b>`);});

gen('vig-dec','3.4','Vižner – dešifrovanje',()=>{const key=pick(['LIMUN','SUNCE','KOSA','MOST','LEMON','KEY','ZIMA']),w=pick(WORDS).slice(0,rnd(6,8)),c=vig(w,key,1);
  const rows=[...c].map((ch,i)=>{const k=key[i%key.length],cn=A.indexOf(ch),kn=A.indexOf(k);return `<tr><td>${ch}</td><td>${k}</td><td>${cn}−${kn}</td><td>${mod(cn-kn,26)}</td><td><b>${A[mod(cn-kn,26)]}</b></td></tr>`;}).join('');
  return inputQ(`Dešifruj Vižnerov šifrat <b class="mono">${c}</b> ključem <b class="mono">${key}</b>.`,'Velikim slovima, bez razmaka.',w,x=>normText(x)===w,
  `P<sub>i</sub> = (C<sub>i</sub> − K<sub>i mod m</sub>) mod 26 (isto što i + 26 − K)<table class="g"><tr><th>C</th><th>K</th><th>C−K</th><th>mod 26</th><th>P</th></tr>${rows}</table>Otvoreni tekst: <b class="mono">${w}</b>`);});

gen('vig-group','3.5','Vižner – grupisanje pozicija',()=>{const m=rnd(3,6),n=rnd(14,24),g=rnd(1,m);const pos=[];for(let i=g;i<=n;i+=m)pos.push(i);
  return inputQ(`Šifrat Vižnerove šifre ima <b>${n}</b> slova, a dužina ključa je <b>m = ${m}</b>. Koje pozicije (brojeći od 1) čine <b>${g}.</b> grupu za statističku analizu?`,'Upiši brojeve razdvojene zarezom, npr. 2, 6, 10',pos.join(', '),x=>{const d=(String(x).match(/\d+/g)||[]).map(Number);return d.length===pos.length&&d.every((v,i)=>v===pos[i]);},
  `Grupa ${g}: ${g}, ${g}+m, ${g}+2m, … = ${g}, ${g+m}, ${g+2*m}, … (do ${n}) → <b>${pos.join(', ')}</b>. Svaka grupa je običan Cezar sa jednim pomerajem.`);});

gen('vig-keylen','3.5','Vižner – dužina ključa iz indeksa koincidencije',()=>{
  for(;;){const k=pick([2,3,4,5,6,8]),n=1200;const I=(((n/k-1)/(n-1))*0.065+((n-n/k)/(n-1))*0.03846);const Ir=Math.round(I*10000)/10000;
    const kk=0.027*n/((n-1)*Ir+0.065-0.0385*n);if(Math.round(kk)!==k)continue;
    return inputQ(`Šifrat Vižnerove šifre ima <b>n = ${n}</b> slova, a izračunat indeks koincidencije je <b>I = ${String(Ir).replace('.',',')}</b>. Koristeći k ≈ 0,027·n / ((n−1)·I + 0,065 − 0,0385·n), proceni dužinu ključa k (zaokruži na ceo broj).`,'Upiši ceo broj.',String(k),x=>{const v=parseNum(x,false);return !isNaN(v)&&Math.round(v)===k;},
    `(n−1)·I = ${(n-1)} · ${Ir} = ${((n-1)*Ir).toFixed(3)}<br>imenilac = ${((n-1)*Ir).toFixed(3)} + 0,065 − 0,0385·${n} = ${((n-1)*Ir+0.065-0.0385*n).toFixed(3)}<br>brojilac = 0,027 · ${n} = ${(0.027*n).toFixed(1)}<br>k ≈ ${kk.toFixed(2)} → <b>${k}</b>`);}});

/* =====================================================================
   SKLADIŠTE (localStorage) + IZVEDENA STATISTIKA
   ===================================================================== */
let store={v:1,log:[],rounds:[]};let storageOk=true;
function load(){try{const s=localStorage.getItem(LS_KEY);if(s){const o=JSON.parse(s);if(o&&Array.isArray(o.log)&&Array.isArray(o.rounds))store=o;}}catch(e){storageOk=false;}}
function save(){try{if(store.log.length>8000)store.log=store.log.slice(-8000);localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){storageOk=false;}}
function derive(){
  const byQ=new Map(),byT=new Map();
  for(const e of store.log){
    let q=byQ.get(e.id);if(!q){q={n:0,last:[],lastRound:0};byQ.set(e.id,q);}
    q.n++;q.last.push(e.s);if(q.last.length>5)q.last.shift();q.lastRound=e.r;
    let t=byT.get(e.topic);if(!t){t={n:0,sum:0,last:[]};byT.set(e.topic,t);}
    t.n++;t.sum+=e.s;t.last.push(e.s);if(t.last.length>10)t.last.shift();
  }
  return {byQ,byT};
}
function topicInfo(id,D){
  const t=D.byT.get(id);if(!t)return {n:0,acc:null,status:'none',label:'nije testirano'};
  const acc=mean(t.last);let status,label;
  if(t.n<2){status='few';label='premalo podataka';}
  else if(acc<0.75){status='weak';label='treba ponoviti';}
  else if(acc>=0.9&&t.n>=4){status='master';label='savladano';}
  else{status='good';label='dobro, još vežbaj';}
  return {n:t.n,acc,status,label,total:mean([t.sum/t.n])};
}
const chipClass={none:'none',few:'none',weak:'bad',good:'mid',master:'ok'};
const pct=x=>Math.round(x*100)+'%';
function isMastered(h){return h&&h.last.length>=2&&h.last[h.last.length-1]>=0.75&&h.last[h.last.length-2]>=0.75;}
function recommendations(D,limit=3){
  const rows=TOPICS.map(t=>({t,i:topicInfo(t.id,D)}));
  const weak=rows.filter(r=>r.i.status==='weak').sort((a,b)=>a.i.acc-b.i.acc);
  const mid=rows.filter(r=>r.i.status==='good'&&r.i.acc<0.9).sort((a,b)=>a.i.acc-b.i.acc);
  const few=rows.filter(r=>r.i.status==='few'&&r.i.acc!==null&&r.i.acc<0.5);
  const none=rows.filter(r=>r.i.status==='none');
  return {list:[...weak,...few,...mid].slice(0,limit),none,rows};
}
function lessonStats(D){
  const o={1:{n:0,sum:0},2:{n:0,sum:0},3:{n:0,sum:0}};
  for(const t of TOPICS){const x=D.byT.get(t.id);if(x){const last=x.last;o[t.lesson].n+=last.length;o[t.lesson].sum+=last.reduce((a,b)=>a+b,0);}}
  return o;
}

/* =====================================================================
   BIRANJE PITANJA ZA RUNDU
   ===================================================================== */
function topicWeight(id,D){const i=topicInfo(id,D);const acc=i.acc===null?0.5:i.acc;return 1+2*(1-acc);}
function buildRound(){
  const D=derive(),rno=store.rounds.length+1;
  const items=[];
  for(const q of BANK){
    const h=D.byQ.get(q.id);let w;
    if(!h)w=5;
    else{const lastS=h.last[h.last.length-1];if(lastS<0.5)w=3.5;else if(isMastered(h))w=0.35;else w=1.2;
      if(h.lastRound===rno-1)w*=0.02;}
    items.push({kind:'s',ref:q,topic:q.topic,w:w*topicWeight(q.topic,D),open:q.type==='open'});
  }
  for(const g of GENS){
    const h=D.byQ.get('g:'+g.id);let w=12;
    if(!h)w=25;else{const lastS=h.last[h.last.length-1];if(lastS<0.5)w=20;else if(isMastered(h)&&h.n>=4)w=6;}
    items.push({kind:'g',ref:g,topic:g.topic,w:w*topicWeight(g.topic,D)});
  }
  const chosen=[],tc={};let opens=0,gens=0;
  while(chosen.length<ROUND_SIZE){
    let el=items.filter(it=>!chosen.includes(it)&&(tc[it.topic]||0)<2&&!(it.open&&opens>=2)&&!(it.kind==='g'&&gens>=4));
    if(!el.length)el=items.filter(it=>!chosen.includes(it));
    const tot=el.reduce((s,it)=>s+it.w,0);let r=Math.random()*tot,sel=el[el.length-1];
    for(const it of el){r-=it.w;if(r<=0){sel=it;break;}}
    chosen.push(sel);tc[sel.topic]=(tc[sel.topic]||0)+1;if(sel.open)opens++;if(sel.kind==='g')gens++;
  }
  return shuffle(chosen).map(instantiate);
}
function instantiate(it){
  if(it.kind==='g'){const x=it.ref.make();return {id:'g:'+it.ref.id,topic:it.ref.topic,type:'in',gen:true,q:x.q,hint:x.hint,check:x.check,answerText:x.answerText,expl:x.expl};}
  const q=it.ref;
  if(q.type==='mc'){const opts=shuffle(q.o.map((t,i)=>({t,c:i===0})));return {id:q.id,topic:q.topic,type:'mc',q:q.q,opts,expl:q.expl,answerText:q.o[0]};}
  if(q.type==='tf'){return {id:q.id,topic:q.topic,type:'mc',q:q.q,opts:[{t:'Tačno',c:q.truth},{t:'Netačno',c:!q.truth}],expl:q.expl,answerText:q.truth?'tvrdnja je tačna':'tvrdnja je netačna',tf:true};}
  if(q.type==='multi'){const opts=shuffle([...q.rights.map(t=>({t,c:true})),...q.wrongs.map(t=>({t,c:false}))]);return {id:q.id,topic:q.topic,type:'multi',q:q.q,opts,expl:q.expl,answerText:q.rights.join(' · ')};}
  if(q.type==='in'){const nums=q.answers.every(a=>!isNaN(parseNum(a,true)));return {id:q.id,topic:q.topic,type:'in',q:q.q,hint:q.hint,answerText:q.answers[0],expl:q.expl,check:r=>q.answers.some(a=>normText(a)===normText(r))||(nums&&!isNaN(parseNum(r,true))&&q.answers.some(a=>parseNum(a,true)===parseNum(r,true)))};}
  return {id:q.id,topic:q.topic,type:'open',q:q.q,points:q.points,expl:q.expl,answerText:q.points.join(' • ')};
}

function recHtml(rec,withNone=true){

function lockOptions(){document.querySelectorAll('#ans .opt').forEach(b=>b.disabled=true);}
function answerMC(i){
  if(round.answered)return;const q=cur();const ok=q.opts[i].c;
  document.querySelectorAll('#ans .opt').forEach((b,j)=>{if(q.opts[j].c)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
  lockOptions();
  finish(ok?1:0,`Tačan odgovor: <b>${q.answerText}</b>`);
}
function answerMulti(){
  if(round.answered)return;const q=cur();const btns=[...document.querySelectorAll('#ans .opt')];
  let hit=0,wrong=0,need=q.opts.filter(o=>o.c).length;
  btns.forEach((b,j)=>{const sel=b.classList.contains('sel'),c=q.opts[j].c;if(sel&&c)hit++;if(sel&&!c)wrong++;
    b.classList.remove('sel');if(c)b.classList.add('right');else if(sel)b.classList.add('wrong');});
  lockOptions();$('#ok').disabled=true;
  const s=Math.max(0,(hit-wrong)/need);
  finish(Math.round(s*100)/100,`Tačni odgovori: <b>${q.answerText}</b>`);
}
function answerIn(dontKnow){
  if(round.answered)return;const q=cur();const inp=$('#inp');const raw=inp.value;
  if(!dontKnow&&!raw.trim()){inp.focus();return;}
  const ok=!dontKnow&&q.check(raw);
  inp.disabled=true;$('#ok').disabled=true;$('#dk').disabled=true;
  finish(ok?1:0,`Tačan odgovor: <b class="mono">${q.answerText}</b>${(!ok&&!dontKnow)?`<br>Tvoj odgovor: <span class="mono">${esc(raw)}</span>`:''}`);
}
function showOpenPoints(){

function finish(score,detail){
  const q=cur();round.answered=true;

  const title=score>=0.999?'✔ Tačno':score>=0.5?`◐ Delimično (${Math.round(score*100)}%)`:'✘ Netačno';

}
function next(){

    <table class="t">${[1,2,3].map(l=>byL[l][1]?`<tr><td style="width:46%">${LESSONS[l]}</td><td style="width:90px">${dec(byL[l][0])}/${byL[l][1]}</td><td><div class="meter"><i style="width:${byL[l][0]/byL[l][1]*100}%;background:${byL[l][0]/byL[l][1]>=.75?'var(--ok)':byL[l][0]/byL[l][1]>=.5?'var(--mid)':'var(--bad)'}"></i></div></td></tr>`:`<tr><td>${LESSONS[l]}</td><td colspan="2" class="muted">nije bilo pitanja</td></tr>`).join('')}</table>
    <h3>Šta ponoviti (na osnovu cele statistike)</h3>${recHtml(rec)}
    ${wrong.length?`<h3>Greške u ovom testu (${wrong.length})</h3>${wrong.map(r=>`<div class="wr"><span class="chip bad">${tname(r.topic)}</span><div style="margin:4px 0">${r.open?stripTags(r.q):stripTags(r.q).slice(0,170)}</div><div><b>Tačno:</b> ${r.open?stripTags(r.ans).slice(0,260):`<span class="${r.gen?'mono':''}">${r.ans}</span>`} <a class="small" href="${anchor(r.topic)}" target="_blank" rel="noopener">skripta ↗</a></div></div>`).join('')}`:`<div class="rec" style="border-color:var(--ok);background:var(--ok-bg)">Bez grešaka u ovom testu.</div>`}
    <h3>Ukupno do sada</h3>
    <div class="grid3"><div class="stat"><b>${o.rounds}</b><span>testova</span></div><div class="stat"><b>${pct(o.acc)}</b><span>ukupna tačnost</span></div><div class="stat"><b>${o.mastered}/${o.total}</b><span>savladanih pitanja</span></div></div>
    <div class="foot"><button class="btn alt" id="dStats">Detaljna statistika</button><button class="btn" id="dOk" autofocus>OK – sledećih ${ROUND_SIZE} zadataka</button></div>`;
  $('#dOk').onclick=()=>{dlg.close();startRound();};
  $('#dStats').onclick=()=>{dlg.close();view='stats';render();};
  if(!dlg.open)dlg.showModal();
  $('#dOk').focus({preventScroll:true});
  $('.dlg').scrollTop=0;
  view='home';
}
dlg.addEventListener('cancel',e=>e.preventDefault());

/* ---------- statistika ---------- */
function renderStats(){
  const D=derive(),o=overallLine(D),rec=recommendations(D),ls=lessonStats(D);
  const bars=store.rounds.slice(-30);
  const chart=bars.length?`<svg viewBox="0 0 ${bars.length*22+10} 110" width="100%" height="120" role="img" aria-label="Rezultati poslednjih testova">${bars.map((r,i)=>{const p=r.sc/r.n,h=Math.max(2,p*80);return `<rect x="${i*22+6}" y="${92-h}" width="16" height="${h}" rx="3" fill="${p>=.75?'var(--ok)':p>=.5?'var(--mid)':'var(--bad)'}"><title>Test #${r.no}: ${Math.round(p*100)}%</title></rect><text x="${i*22+14}" y="106" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">${r.no}</text>`;}).join('')}<line x1="0" x2="${bars.length*22+10}" y1="${92-60}" y2="${92-60}" stroke="currentColor" stroke-dasharray="3 4" opacity=".25"/></svg>`:'<p class="muted">Još nema završenih testova.</p>';
  app.innerHTML=`
  <div class="card"><h1>Statistika</h1>
    <div class="grid3">
      <div class="stat"><b>${o.rounds}</b><span>završenih testova</span></div>
      <div class="stat"><b>${o.n}</b><span>odgovora ukupno</span></div>
      <div class="stat"><b>${o.n?pct(o.acc):'–'}</b><span>ukupna tačnost</span></div>
      <div class="stat"><b>${o.mastered}/${o.total}</b><span>savladanih pitanja</span></div>
    </div>
    <div class="prog" style="margin-top:12px"><i style="width:${o.mastered/o.total*100}%;background:var(--ok)"></i></div>
    <div class="muted small">Pitanje je „savladano" kada je poslednja dva puta odgovoreno tačno (≥ 75%). Zadaci sa računanjem se generišu uvek iznova pa se ne računaju u ovaj broj.</div>
  </div>
  <div class="card"><h2>Šta ponoviti</h2>${recHtml(rec)}</div>
  <div class="card"><h2>Po lekcijama</h2><table class="t">${[1,2,3].map(l=>{const x=ls[l];const a=x.n?x.sum/x.n:null;return `<tr><td style="width:44%">${LESSONS[l]}</td><td style="width:70px">${a===null?'–':pct(a)}</td><td><div class="meter"><i style="width:${(a||0)*100}%;background:${a>=.75?'var(--ok)':a>=.5?'var(--mid)':'var(--bad)'}"></i></div></td></tr>`;}).join('')}</table></div>
  <div class="card"><h2>Po temama (odeljci skripte)</h2>
    <table class="t"><tr><th>Odeljak</th><th>Odgovora</th><th>Uspešnost (poslednjih ≤10)</th><th>Status</th></tr>
    ${TOPICS.map(t=>{const i=topicInfo(t.id,D);return `<tr><td><a href="${anchor(t.id)}" target="_blank" rel="noopener">${tname(t.id)}</a></td><td>${i.n}</td><td style="min-width:120px">${i.acc===null?'–':`<div class="meter"><i style="width:${i.acc*100}%;background:${i.acc>=.75?'var(--ok)':i.acc>=.5?'var(--mid)':'var(--bad)'}"></i></div> <span class="small">${pct(i.acc)}</span>`}</td><td><span class="chip ${chipClass[i.status]}">${i.label}</span></td></tr>`;}).join('')}
    </table></div>
  <div class="card"><h2>Rezultati testova</h2>${chart}<div class="muted small">Poslednjih ${bars.length||0} testova (zeleno ≥ 75%, žuto ≥ 50%, crveno ispod; isprekidana linija = 75%).</div></div>
  <div class="card"><h2>Podaci</h2><div class="row"><button class="btn alt sm" id="exp">Izvezi (JSON)</button><label class="btn alt sm" style="cursor:pointer">Uvezi<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn alt sm" id="rst" style="color:var(--bad)">Obriši statistiku</button></div>
    <div class="muted small" style="margin-top:8px">Statistika se čuva lokalno u ovom pretraživaču. Ako menjaš pretraživač ili računar, izvezi je pa uvezi.</div></div>`;
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify(store)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='zis-statistika.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o&&Array.isArray(o.log)&&Array.isArray(o.rounds)){store=o;save();render();}else alert('Neispravan fajl.');}catch(x){alert('Neispravan fajl.');}};rd.readAsText(f);};
  $('#rst').onclick=()=>{if(confirm('Obrisati svu statistiku? Ovo se ne može poništiti.')){store={v:1,log:[],rounds:[]};save();round=null;render();}};
}

/* ---------- tastatura ---------- */
document.addEventListener('keydown',e=>{
  if(dlg.open||view!=='quiz'||!round||e.ctrlKey||e.metaKey||e.altKey)return;
  const q=cur(),tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'){
    if(round.answered){e.preventDefault();next();return;}
    if(q.type==='in'){e.preventDefault();answerIn(false);return;}
    if(q.type==='multi'){e.preventDefault();answerMulti();return;}
    return;
  }
  if(tag==='input'||tag==='textarea')return;
  if(!round.answered&&(q.type==='mc'||q.type==='multi')){
    const i=(e.key>='1'&&e.key<='6')?+e.key-1:'abcdef'.indexOf(e.key.toLowerCase());
    if(i>=0&&i<q.opts.length){e.preventDefault();if(q.type==='mc')answerMC(i);else{const b=document.querySelectorAll('#ans .opt')[i];b.classList.toggle('sel');}}
  }
});

/* =====================================================================
   SAMOPROVERA (otvori ZIS_Test_znanja.html#selftest)
   ===================================================================== */
function selftest(){
  const out=[];let bad=0;const fail=m=>{bad++;out.push('✘ '+m);};
  const eq=(name,a,b)=>{if(a!==b)fail(`${name}: dobijeno ${a}, očekivano ${b}`);};
  /* poznati primeri sa slajdova */
  eq('Cezar dešifrovanje',caesar('CSYEVIXIVQMREXIH',-4),'YOUARETERMINATED');
  eq('Cezar Z+4',caesar('Z',4),'D');eq('Cezar A-4',caesar('A',-4),'W');
  eq('Vižner LIMUN',vig('NAPADIUZORU','LIMUN',1),'YIBUQTCLIEF');
  eq('Hil MEETMEHERE',hillText('MEETMEHERE',[[22,13],[11,5]]),'EWXJEWYTKZ');
  eq('Transpozicija 3x7',colTransp('OCEKUJEMMIHOLJSKOLETO',7),'OMSCMKEIOKHLUOEJLTEJO');
  eq('Transpozicija KOSA',colTransp('OCEKUJEMMIHOLJSKOLETO',4,keyOrder('KOSA')),'KMOKTOUMLOOCJIJLEEHSE');
  eq('Skitala obim 4 (4 reda x 6 kolona)',colTransp('OCEKUJEMMIHOLJSKOLETO',6),'OELECMJTEMSOKIKUHOJOL');
  eq('Dvostruka transpozicija',doubleTransp('ATTACKXATXDAWNX',5,3,[2,4,0,3,1],[0,2,1]),'XTAWXNATTXADAKC');
  eq('OTP THREEHILLS',[...'THREEHILLS'].map((p,i)=>OTPA[parseInt(xorStr(bin3(p),bin3('TRSRTLERSE'[i])),2)]).join(''),'ELKRTRIHIS');
  eq('Homofona TEETH',[...'TEETH'].map(l=>HOMO[l][0]).join(' ').replace(/\s/g,'').length,10);
  eq('Atbaš',atbash('ABCDEFGH'),'ZYXWVUTS');
  eq('Hil inverz',JSON.stringify(hillInv([[22,13],[11,5]])),JSON.stringify([[3,13],[9,8]]));
  eq('Homofona – 32 jedinstvena koda',Object.keys(HOMO_REV).length,32);
  /* banka pitanja */
  const ids=new Set();
  for(const q of BANK){
    if(ids.has(q.id))fail('duplikat id '+q.id);ids.add(q.id);
    if(!TOPIC[q.topic])fail('nepoznata tema '+q.id);
    if(!q.q)fail('prazan tekst '+q.id);
    if(q.type==='mc'){if(new Set(q.o).size!==q.o.length)fail('duplirane opcije '+q.id);if(q.o.length<2)fail('premalo opcija '+q.id);}
    if(q.type==='multi'&&(q.rights.length<1||q.wrongs.length<1))fail('multi '+q.id);
    if(q.type==='open'&&!(q.points&&q.points.length>=2))fail('open bez tačaka '+q.id);
    if(q.type==='in'){const x=instantiate({kind:'s',ref:q});if(!x.check(q.answers[0]))fail('in odgovor ne prolazi '+q.id);}
  }
  /* generatori */
  for(const g of GENS){
    if(!TOPIC[g.topic])fail('gen tema '+g.id);
    for(let i=0;i<400;i++){
      let x;try{x=g.make();}catch(e){fail(`${g.id} izuzetak: ${e.message}`);break;}
      if(!x.q||!x.expl||!x.answerText||typeof x.check!=='function'){fail(`${g.id} nepotpun`);break;}
      if(!x.check(x.answerText)){fail(`${g.id} sopstveni odgovor ne prolazi: ${x.answerText}`);break;}
      if(/NaN|undefined/.test(x.q+x.expl+x.answerText)){fail(`${g.id} NaN/undefined`);break;}
      if(x.check('')||x.check('   ')){fail(`${g.id} prihvata prazan odgovor`);break;}
    }
  }
  /* razmeštaj opcija ne sme da menja tačnost */
  for(let i=0;i<200;i++){const it=instantiate({kind:'s',ref:BANK.find(b=>b.type==='mc')});if(it.opts.filter(o=>o.c).length!==1){fail('mc broj tačnih != 1');break;}}
  /* biranje runde */
  for(let i=0;i<50;i++){const r=buildRound();if(r.length!==ROUND_SIZE||new Set(r.map(x=>x.id)).size!==ROUND_SIZE){fail('runda ima duplikate/pogrešan broj');break;}}
  const perTopic={};for(const q of BANK)perTopic[q.topic]=(perTopic[q.topic]||0)+1;
  for(const t of TOPICS)if(!perTopic[t.id]&&!GENS.some(g=>g.topic===t.id))fail('tema bez pitanja '+t.id);
  const summary=`pitanja: ${BANK.length} (open ${BANK.filter(q=>q.type==='open').length}), generatora: ${GENS.length}, grešaka: ${bad}`;
  return {bad,summary,perTopic,out};
}
window.__selftest=selftest;

/* ---------- start ---------- */
load();
if(location.hash==='#selftest'){
  const r=selftest();
  app.innerHTML=`<div class="card"><h1>Samoprovera</h1><p><b>${r.summary}</b></p><pre style="white-space:pre-wrap">${esc(r.out.join('\n')||'Sve provere prošle.')}</pre><pre>${esc(JSON.stringify(r.perTopic))}</pre></div>`;
  setTab();
}else render();
</script>
